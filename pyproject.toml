[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zwcad-standard-mcp"
version = "0.1.0"
description = "A user-scenario-driven MCP server for ZWCAD Standard via the public COM API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZWCAD Standard MCP contributors" }]
dependencies = [
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.7,<3",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
zwcad-standard-mcp = "zwcad_standard_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
